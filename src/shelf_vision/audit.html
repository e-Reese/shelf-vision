<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shelf Vision · Tray review</title>
<style>
:root{font-family:system-ui,sans-serif;color:#e8eef4;background:#101820;color-scheme:dark}*{box-sizing:border-box}body{margin:0}header{padding:18px 24px;border-bottom:1px solid #33424e;display:flex;align-items:center;gap:24px}h1{font-size:21px;margin:0}a{color:#8bdbff}header a{margin-left:auto}p{color:#b5c5d0;line-height:1.5}button,select,textarea{font:inherit;border:1px solid #526575;border-radius:7px;background:#20303d;color:inherit;padding:10px}button{cursor:pointer}button:hover{background:#324957}button:disabled{opacity:.5;cursor:wait}button.active{border-color:#91e1ff;background:#254d60}main{display:grid;grid-template-columns:220px minmax(300px,1fr) 290px;height:calc(100vh - 75px)}aside{padding:18px;overflow:auto}.stage{min-height:400px;display:flex;flex-direction:column;background:#080e14;border-inline:1px solid #33424e}.toolbar{padding:12px;display:flex;gap:8px;align-items:center}.toolbar span{margin-left:auto;font-size:13px;color:#afbfcb}svg{width:100%;flex:1;min-height:0;touch-action:manipulation}.frame{display:block;width:100%;text-align:left;margin-top:10px;font-size:13px;overflow-wrap:anywhere}.boxlist{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}.boxlist button{padding:7px;min-width:42px}.decision{display:block;width:100%;text-align:left;margin:10px 0}.decision.active{outline:2px solid #8edfff}textarea{width:100%;resize:vertical;min-height:95px}label{display:block;margin:18px 0 8px;font-size:14px}.muted{font-size:13px;color:#afbfcb}#saveStatus{min-height:42px;font-size:14px;line-height:1.4;color:#a2dec2}#error{color:#ffb9ad;padding:10px 24px;background:#4c2828;white-space:pre-wrap}#error:empty{display:none}.badge{font-size:13px;border-radius:5px;padding:5px;background:#263a48;display:inline-block}h2{font-size:20px}#reason{font-size:14px}select{width:100%}.nav{display:flex;gap:8px;margin-top:20px}.nav button{flex:1}rect.hit{cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #a1ddff;outline-offset:2px}@media(max-width:950px){main{grid-template-columns:160px 1fr;height:auto}.stage{height:65vh}aside:last-child{grid-column:1/-1}.decision{display:inline-block;width:auto;margin-right:8px}header{flex-wrap:wrap}.toolbar{flex-wrap:wrap}}
</style></head><body>
<header><h1>Tray review</h1><span id="progress">Loading review…</span><a href="/api/audit/export">Export decisions</a><a href="/">Shelf editor</a></header><div id="error" role="alert"></div>
<main><aside><label for="filter">Show</label><select id="filter"><option value="flagged">Uncertain boxes</option><option value="all">All boxes</option></select><p class="muted">One box = one physical tray. Click a box or its number to review it.</p><div id="frames"></div><div id="boxes" class="boxlist"></div></aside>
<section class="stage"><div class="toolbar"><button id="focus">Focus box</button><button id="fit">Fit shelf</button><span id="frameLabel"></span></div><svg id="canvas" xmlns="http://www.w3.org/2000/svg" aria-label="Shelf image with clickable tray boxes"></svg></section>
<aside><span class="badge" id="status">Loading</span><h2 id="title">Choose a box</h2><p id="reason"></p><div id="choices"><button class="decision" data-value="tray">Tray · T</button><button class="decision" data-value="not_tray">Not a tray · N</button><button class="decision" data-value="needs_adjustment">Needs adjustment · A</button><button class="decision" data-value="pending">Clear decision</button></div><label for="note">Note (optional)</label><textarea id="note" maxlength="2000" placeholder="For example: tighten the right edge"></textarea><button id="saveNote">Save note</button><p id="saveStatus" role="status" aria-live="polite"></p><p class="muted">Decisions save automatically. Notes also save when you change boxes. “Needs adjustment” flags a box for a later geometry edit.</p><div class="nav"><button id="prev">Previous</button><button id="next">Next</button></div></aside></main>
<script>
'use strict';
const $=id=>document.getElementById(id), names={pending:'Not reviewed',tray:'Tray',not_tray:'Not a tray',needs_adjustment:'Needs adjustment'}, colors={pending:'#ffc66b',tray:'#65e7a6',not_tray:'#ff8989',needs_adjustment:'#ba9dff'};
const review=new URLSearchParams(location.search).get('review')||'visit-002';
const query='?review='+encodeURIComponent(review);
document.querySelector('a[href="/api/audit/export"]').href='/api/audit/export'+query;
if(review==='training'){document.querySelector('h1').textContent='Training tray review';document.title='Training tray review';}
let data,current,filter='flagged',busy=false,zoom=false;
const visible=()=>data.items.filter(x=>filter==='all'||x.flagged);
function error(e){$('error').textContent=e.message||String(e)}
async function request(url,options){const r=await fetch(url,options);if(!r.ok){let message=await r.text();try{const j=JSON.parse(message);message=j.detail||j.error||message}catch{}throw new Error(typeof message==='string'?message:JSON.stringify(message))}return r.json()}
function lock(value){busy=value;document.querySelectorAll('button,select,textarea').forEach(el=>el.disabled=value)}
async function save(decision=current.decision){if(busy)return false;if(decision===current.decision&&$('note').value===current.note)return true;lock(true);$('saveStatus').textContent='Saving…';$('error').textContent='';try{const result=await request('/api/audit/'+encodeURIComponent(current.region_id)+query,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({revision:current.revision,decision,note:$('note').value})});Object.assign(current,result);render();$('saveStatus').textContent='Saved on this computer.';return true}catch(e){error(e);$('saveStatus').textContent='Not saved. Your note is still here. If another tab changed this box, copy your note before reloading.';return false}finally{lock(false)}}
async function select(item){if(busy||!item)return;if(current&&!await save())return;current=item;render();$('saveStatus').textContent=current.revision?'Saved on this computer.':''}
function button(text,action,active){const b=document.createElement('button');b.textContent=text;b.onclick=action;if(active)b.classList.add('active');return b}
function svgEl(tag,attrs){const e=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const[k,v]of Object.entries(attrs))e.setAttribute(k,v);return e}
function draw(){const svg=$('canvas'),f=data.frames.find(f=>f.frame_id===current.frame_id);svg.replaceChildren();let view=[0,0,f.width,f.height];if(zoom){const[x1,y1,x2,y2]=current.bbox_xyxy,p=Math.max(x2-x1,y2-y1)*.5;const l=Math.max(0,x1-p),t=Math.max(0,y1-p);view=[l,t,Math.min(f.width,x2+p)-l,Math.min(f.height,y2+p)-t]}svg.setAttribute('viewBox',view.join(' '));svg.append(svgEl('image',{href:f.image_url,width:f.width,height:f.height}));const rows=data.items.filter(x=>x.frame_id===f.frame_id).sort((a,b)=>(a===current)-(b===current));for(const item of rows){const[x1,y1,x2,y2]=item.bbox_xyxy,chosen=item===current,c=chosen?'#ffffff':colors[item.decision],g=svgEl('g',{}),r=svgEl('rect',{x:x1,y:y1,width:x2-x1,height:y2-y1,fill:chosen?'#ffffff18':'transparent',stroke:c,'stroke-width':chosen?4:1.5,'vector-effect':'non-scaling-stroke',class:'hit'});r.onclick=()=>select(item);const title=svgEl('title',{});title.textContent='Box '+item.number+': '+names[item.decision];r.append(title);g.append(r);const size=Math.max(10,view[2]/65);g.append(svgEl('rect',{x:x1,y:y1,width:size*2.8,height:size*1.45,fill:chosen?'#ffffff':'#101820','pointer-events':'none'}));const t=svgEl('text',{x:x1+size*.25,y:y1+size*1.08,fill:chosen?'#101820':c,'font-size':size,'font-weight':700,'pointer-events':'none'});t.textContent=item.number;g.append(t);svg.append(g)}}
function render(){const flagged=data.items.filter(x=>x.flagged),list=visible();$('progress').textContent=flagged.filter(x=>x.decision!=='pending').length+' / '+flagged.length+' uncertain boxes reviewed';$('filter').value=filter;$('frames').replaceChildren();for(const f of data.frames){const items=list.filter(x=>x.frame_id===f.frame_id);if(!items.length)continue;const b=button(f.frame_id.replace('visit-002-','')+' · '+items.filter(x=>x.decision!=='pending').length+'/'+items.length,()=>select(items.find(x=>x.decision==='pending')||items[0]),f.frame_id===current.frame_id);b.classList.add('frame');$('frames').append(b)}$('boxes').replaceChildren();for(const item of list.filter(x=>x.frame_id===current.frame_id)){const b=button(String(item.number)+(item.decision==='pending'?'':' ✓'),()=>select(item),item===current);b.title=names[item.decision];$('boxes').append(b)}$('frameLabel').textContent=current.frame_id;$('title').textContent='Box '+current.number;$('status').textContent=names[current.decision];$('reason').textContent='Audit note: '+current.reason;$('note').value=current.note;document.querySelectorAll('[data-value]').forEach(b=>b.classList.toggle('active',b.dataset.value===current.decision));draw()}
$('filter').onchange=async()=>{const value=$('filter').value;if(current&&!await save()){$('filter').value=filter;return}filter=value;const list=visible();current=list.includes(current)?current:list.find(x=>x.decision==='pending')||list[0];render()};
$('focus').onclick=()=>{zoom=true;draw()};$('fit').onclick=()=>{zoom=false;draw()};$('saveNote').onclick=()=>save();document.querySelectorAll('[data-value]').forEach(b=>b.onclick=()=>save(b.dataset.value));
async function step(delta){const list=visible(),i=list.indexOf(current);await select(list[(Math.max(0,i)+delta+list.length)%list.length])}
$('next').onclick=()=>step(1);$('prev').onclick=()=>step(-1);document.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.ctrlKey||e.metaKey||e.altKey||busy)return;const key=e.key.toLowerCase();if({t:1,n:1,a:1}[key]){e.preventDefault();save({t:'tray',n:'not_tray',a:'needs_adjustment'}[key])}});window.addEventListener('beforeunload',e=>{if(busy||(current&&$('note').value!==current.note)){e.preventDefault();e.returnValue=''}});
(async()=>{lock(true);try{data=await request('/api/audit'+query);if(!data.items.length)throw new Error('No boxes available for review.');if(!data.items.some(x=>x.flagged))filter='all';current=visible().find(x=>x.decision==='pending')||visible()[0];render()}catch(e){error(e)}finally{lock(false)}})();
</script></body></html>
